<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas - Tutor IA ITM</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .panel-estadisticas {
            max-width: 960px;
            margin: 0 auto;
            padding: 30px 25px 60px;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .panel-header h1 {
            font-size: 1.5rem;
            color: var(--primary);
        }

        .panel-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .panel-acciones {
            display: flex;
            gap: 10px;
        }

        .panel-acciones a,
        .panel-acciones button {
            padding: 9px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .panel-acciones a:hover,
        .panel-acciones button:hover {
            border-color: var(--primary);
        }

        .tarjetas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .tarjeta {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
        }

        .tarjeta-valor {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
        }

        .tarjeta-etiqueta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .seccion {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .seccion h2 {
            font-size: 1rem;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        .barra-fila {
            display: grid;
            grid-template-columns: minmax(120px, 220px) 1fr auto;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }

        .barra-etiqueta {
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .barra-track {
            background-color: var(--surface-alt);
            border-radius: 999px;
            height: 10px;
            overflow: hidden;
        }

        .barra-relleno {
            height: 100%;
            background-color: var(--primary);
            border-radius: 999px;
        }

        .barra-relleno.groq { background-color: var(--primary); }
        .barra-relleno.gemini { background-color: #8e44ad; }
        .barra-relleno.up { background-color: #28a745; }
        .barra-relleno.down { background-color: var(--danger); }

        .barra-cantidad {
            color: var(--text-muted);
            min-width: 30px;
            text-align: right;
        }

        .mensaje-vacio {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: center;
            padding: 20px 0;
        }
    </style>
</head>
<body style="height: auto; overflow: auto; display: block;">

    <div class="panel-estadisticas">

        <div class="panel-header">
            <div>
                <h1>Panel de estadísticas</h1>
                <p>Datos agregados a partir de las conversaciones reales con el Tutor IA (sin exponer preguntas o respuestas individuales).</p>
            </div>
            <div class="panel-acciones">
                <button onclick="cargarEstadisticas()">Actualizar</button>
                <a href="index.html">Volver a la app</a>
            </div>
        </div>

        <div id="contenido">
            <p class="mensaje-vacio">Cargando estadísticas...</p>
        </div>

    </div>

    <script>
        function crearFilaBarra(etiqueta, cantidad, maximo, claseColor) {
            const porcentaje = maximo > 0 ? Math.max(4, Math.round((cantidad / maximo) * 100)) : 0;

            const fila = document.createElement("div");
            fila.className = "barra-fila";

            const spanEtiqueta = document.createElement("span");
            spanEtiqueta.className = "barra-etiqueta";
            spanEtiqueta.textContent = etiqueta;
            spanEtiqueta.title = etiqueta;

            const track = document.createElement("div");
            track.className = "barra-track";

            const relleno = document.createElement("div");
            relleno.className = `barra-relleno ${claseColor || ""}`;
            relleno.style.width = `${porcentaje}%`;

            track.appendChild(relleno);

            const spanCantidad = document.createElement("span");
            spanCantidad.className = "barra-cantidad";
            spanCantidad.textContent = cantidad;

            fila.appendChild(spanEtiqueta);
            fila.appendChild(track);
            fila.appendChild(spanCantidad);

            return fila;
        }

        function formatearMs(ms) {
            if (!ms) return "0 s";
            return `${(ms / 1000).toFixed(1)} s`;
        }

        async function cargarEstadisticas() {
            const contenido = document.getElementById("contenido");
            contenido.innerHTML = '<p class="mensaje-vacio">Cargando estadísticas...</p>';

            try {
                const respuesta = await fetch("/api/estadisticas");
                if (!respuesta.ok) throw new Error(`Error del servidor: ${respuesta.status}`);

                const datos = await respuesta.json();
                contenido.innerHTML = "";

                if (datos.totalIntercambios === 0) {
                    contenido.innerHTML = '<p class="mensaje-vacio">Todavía no hay conversaciones registradas. Los datos aparecerán aquí a medida que se use el Tutor IA.</p>';
                    return;
                }

                // Tarjetas resumen
                const tarjetas = document.createElement("div");
                tarjetas.className = "tarjetas";

                const tasaExito = datos.totalIntercambios
                    ? Math.round((datos.exitosos / datos.totalIntercambios) * 100)
                    : 0;

                const infoTarjetas = [
                    { valor: datos.totalIntercambios, etiqueta: "Intercambios totales con la IA" },
                    { valor: `${tasaExito}%`, etiqueta: "Tasa de éxito (Groq + Gemini)" },
                    { valor: formatearMs(datos.tiempoPromedioMs), etiqueta: "Tiempo promedio de respuesta" },
                    { valor: datos.porcentajeUtil !== null ? `${datos.porcentajeUtil}%` : "Sin datos", etiqueta: "Respuestas marcadas como útiles" }
                ];

                infoTarjetas.forEach(info => {
                    const tarjeta = document.createElement("div");
                    tarjeta.className = "tarjeta";
                    tarjeta.innerHTML = `<div class="tarjeta-valor">${info.valor}</div><div class="tarjeta-etiqueta">${info.etiqueta}</div>`;
                    tarjetas.appendChild(tarjeta);
                });

                contenido.appendChild(tarjetas);

                // Temas más consultados
                const seccionTemas = document.createElement("div");
                seccionTemas.className = "seccion";
                seccionTemas.innerHTML = "<h2>Temas más consultados</h2>";

                if (datos.temasMasConsultados.length === 0) {
                    seccionTemas.innerHTML += '<p class="mensaje-vacio">Sin datos todavía.</p>';
                } else {
                    const maximoTema = Math.max(...datos.temasMasConsultados.map(t => t.cantidad));
                    datos.temasMasConsultados.forEach(t => {
                        seccionTemas.appendChild(crearFilaBarra(t.topico, t.cantidad, maximoTema));
                    });
                }

                contenido.appendChild(seccionTemas);

                // Groq vs Gemini
                const seccionProveedor = document.createElement("div");
                seccionProveedor.className = "seccion";
                seccionProveedor.innerHTML = "<h2>Proveedor de IA que respondió</h2>";

                const entradasProveedor = Object.entries(datos.porProveedor || {});

                if (entradasProveedor.length === 0) {
                    seccionProveedor.innerHTML += '<p class="mensaje-vacio">Sin datos todavía.</p>';
                } else {
                    const maximoProveedor = Math.max(...entradasProveedor.map(([, cantidad]) => cantidad));
                    entradasProveedor.forEach(([proveedor, cantidad]) => {
                        const nombre = proveedor === "groq" ? "Groq (principal)" : proveedor === "gemini" ? "Gemini (respaldo)" : proveedor;
                        seccionProveedor.appendChild(crearFilaBarra(nombre, cantidad, maximoProveedor, proveedor));
                    });
                }

                contenido.appendChild(seccionProveedor);

                // Feedback
                const seccionFeedback = document.createElement("div");
                seccionFeedback.className = "seccion";
                seccionFeedback.innerHTML = "<h2>Valoraciones de los estudiantes</h2>";

                if (datos.totalFeedback === 0) {
                    seccionFeedback.innerHTML += '<p class="mensaje-vacio">Todavía no hay valoraciones (👍/👎) registradas.</p>';
                } else {
                    const maximoFeedback = Math.max(datos.positivos, datos.negativos);
                    seccionFeedback.appendChild(crearFilaBarra("Fue útil", datos.positivos, maximoFeedback, "up"));
                    seccionFeedback.appendChild(crearFilaBarra("No fue útil", datos.negativos, maximoFeedback, "down"));
                }

                contenido.appendChild(seccionFeedback);

            } catch (error) {
                contenido.innerHTML = `<p class="mensaje-vacio">No se pudieron cargar las estadísticas.<br>Detalle: ${error.message}</p>`;
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const temaGuardado = localStorage.getItem("tema");
            if (temaGuardado === "oscuro") {
                document.body.classList.add("dark-mode");
            }

            cargarEstadisticas();
        });
    </script>

</body>
</html>
